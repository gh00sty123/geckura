[workspace]
members = [
    "programs/mystery_box"
]
resolver = "2"

[profile.release]
overflow-checks = false
opt-level = "z"
lto = true
codegen-units = 1

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.com/mystery-box"

[workspace.dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "associated_token", "token_2022"] }
solana-program = "=1.18.26"
