[package]
name = "mystery_box"
version = "0.1.0"
anchor_version = "1.0.1"

[provider]
# IMPORTANT: Set your RPC URL here. Never commit API keys to git.
# Override with: anchor --provider.cluster <URL>
cluster = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[hooks]
pre-build = "cargo build --lib --profile release --target sbf-solana-solana"